name: CI

on:
  push:
    branches:
      - develop
      - 'task/**'
      - 'test/**'
      - 'feature/**'
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        working-directory: src/backend
        run: npm install

      - name: Rodar testes
        working-directory: src/backend
        run: npm test